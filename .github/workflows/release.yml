name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A tag that matches version-name ships the extension too; a patch tag
      # such as v1.1.1 (version-name stays 1.1) ships only the service.
      - name: Decide what this release contains
        id: kind
        run: |
          version_name=$(python3 -c \
            'import json; print(json.load(open("metadata.json"))["version-name"])')
          if [ "v$version_name" = "$GITHUB_REF_NAME" ]; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
          else
            echo "extension=false" >> "$GITHUB_OUTPUT"
          fi

      # gnome-extensions packaging comes with gnome-shell.
      - name: Install packaging tools
        if: steps.kind.outputs.extension == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell

      - name: Build extension package
        if: steps.kind.outputs.extension == 'true'
        run: |
          glib-compile-schemas schemas/
          gnome-extensions pack --force \
            --extra-source=utils.js \
            --extra-source=hidbattery.js \
            --extra-source=LICENSE

      - name: Check package contents
        if: steps.kind.outputs.extension == 'true'
        run: |
          unzip -l ampere@crian.shell-extension.zip
          if unzip -l ampere@crian.shell-extension.zip \
              | grep -E 'daemon/|README|CONTRIBUTING|screenshots/|\.png'; then
            echo "package contains files that do not belong there" >&2
            exit 1
          fi

      - name: Build the companion service
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd daemon
          python3 -m ampere_hid build --stamp "$version" ../ampere-hid
          cd ..
          test "$(./ampere-hid --version)" = "ampere-hid ${version}"
          sha256sum ampere-hid > ampere-hid.sha256

      - name: Extract notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## v" version "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(./ampere-hid ./ampere-hid.sha256)
          if [ "${{ steps.kind.outputs.extension }}" = "true" ]; then
            files+=(./ampere@crian.shell-extension.zip)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
