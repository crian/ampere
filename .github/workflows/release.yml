name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gnome-extensions packaging comes with gnome-shell.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell

      - name: Build extension package
        run: |
          glib-compile-schemas schemas/
          gnome-extensions pack --force \
            --extra-source=utils.js \
            --extra-source=hidbattery.js \
            --extra-source=LICENSE

      - name: Check package contents
        run: |
          unzip -l ampere@crian.shell-extension.zip
          if unzip -l ampere@crian.shell-extension.zip \
              | grep -E 'daemon/|README|CONTRIBUTING|screenshots/|\.png'; then
            echo "package contains files that do not belong there" >&2
            exit 1
          fi

      - name: Pack the companion service
        run: tar -czf ampere-hid.tar.gz daemon

      - name: Extract notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## v" version "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./ampere@crian.shell-extension.zip \
            ./ampere-hid.tar.gz \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
