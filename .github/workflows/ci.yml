name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin python3-gi dbus gjs
          python3 -m pip install --user ruff

      - name: Compile settings schema
        run: make schemas

      - name: Lint Python
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ruff check daemon

      # Includes the daemon smoke test on a private session bus
      # (daemon/tests/test_daemon_bus.py).
      - name: Python tests
        run: make test-py

      - name: JavaScript tests
        run: make test-js

      - name: Lint JavaScript
        run: make lint

      - name: Build the single-file program
        run: |
          make daemon
          ./ampere-hid --help
          test "$(./ampere-hid --version)" = "ampere-hid dev"
          # The built file must carry the full rule set and run on its own.
          test "$(./ampere-hid rules | grep -c uaccess)" -gt 0

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # gnome-extensions packaging ships with gnome-shell.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell

      - name: Build the package
        run: make pack

      - name: Check the package contents
        run: make check-pack
