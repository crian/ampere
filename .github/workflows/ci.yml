name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin shellcheck
          python3 -m pip install --user ruff

      - name: Compile settings schema
        run: glib-compile-schemas --strict schemas/

      - name: Lint Python
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ruff check daemon

      - name: Python tests
        run: python3 -m unittest discover -s daemon/tests -v

      - name: Lint JavaScript
        run: npx --yes eslint@9 extension.js prefs.js utils.js hidbattery.js

      - name: Lint shell scripts
        run: shellcheck -S error daemon/install.sh daemon/uninstall.sh

      - name: Shell syntax
        run: |
          bash -n daemon/install.sh
          bash -n daemon/uninstall.sh
