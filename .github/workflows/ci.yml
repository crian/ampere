name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin python3-gi dbus
          python3 -m pip install --user ruff

      - name: Compile settings schema
        run: glib-compile-schemas --strict schemas/

      - name: Lint Python
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ruff check daemon

      # Includes the daemon smoke test on a private session bus
      # (daemon/tests/test_daemon_bus.py).
      - name: Python tests
        run: python3 -m unittest discover -s daemon/tests -v

      - name: Lint JavaScript
        run: npx --yes eslint@10 extension.js prefs.js utils.js hidbattery.js

      - name: Build the single-file program
        run: |
          cd daemon
          python3 -m ampere_hid build ../ampere-hid
          cd ..
          ./ampere-hid --help
          test "$(./ampere-hid --version)" = "ampere-hid dev"
          # The built file must carry the full rule set and run on its own.
          test "$(./ampere-hid rules | grep -c uaccess)" -gt 0

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gnome-extensions packaging ships with gnome-shell.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell

      - name: Build the package
        run: |
          glib-compile-schemas schemas/
          gnome-extensions pack --force \
            --extra-source=utils.js \
            --extra-source=hidbattery.js \
            --extra-source=LICENSE

      - name: Check the package contents
        run: |
          unzip -l ampere@crian.shell-extension.zip
          if unzip -l ampere@crian.shell-extension.zip \
              | grep -E 'daemon/|README|CONTRIBUTING|screenshots/|\.png'; then
            echo "package contains files that do not belong there" >&2
            exit 1
          fi
