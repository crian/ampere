<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4f63"/>
      <stop offset="1" stop-color="#1c2631"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#26a269"/>
      <stop offset="1" stop-color="#8ff0a4"/>
    </linearGradient>
    <linearGradient id="mouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6dde5"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- ring track -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="16"/>
  <!-- ring progress (about 75 %), starts at 12 o'clock -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="url(#ring)" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="405 541" transform="rotate(-90 128 128)"/>
  <!-- mouse -->
  <rect x="98" y="84" width="60" height="88" rx="30" fill="url(#mouse)"/>
  <g stroke="#2a3745" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M98 120 H158"/>
    <path d="M128 84 V120"/>
  </g>
  <rect x="123" y="97" width="10" height="16" rx="5" fill="#2a3745"/>
</svg>
